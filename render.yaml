# Konfigurasi Render untuk backend FastAPI (Python). Lihat deploy.md bagian 3.
# Catatan: Blueprint Render meminta kartu pembayaran; tanpa kartu, buat "Web Service" Free secara manual
# dengan perintah build/start di bawah ini. Rahasia yang wajib hanya SUPABASE_SERVICE_KEY.
services:
  - type: web
    name: pythagoras-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/sehat
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        value: https://hjhltqqwwzbbgkpwzcxx.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false # rahasia: diisi sendiri di dashboard Render, JANGAN ditulis di sini
      - key: ASAL_DIIZINKAN
        value: https://azkiah-safira-pythagoras.vercel.app,http://localhost:5173
