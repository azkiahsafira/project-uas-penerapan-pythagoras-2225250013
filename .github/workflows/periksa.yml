# Memeriksa kode setiap ada push ke main: lint, build, dan semua pengujian otomatis (JavaScript & Python) harus lolos.
# Aplikasi dipasang otomatis oleh Vercel (https://azkiah-safira-pythagoras.vercel.app), bukan GitHub Pages.
name: Periksa kode

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend analisis -q
